{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="dashboard-layout">
    <div class="left-dashboard">
        <h2>Create Budget</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit"; class="btn btn-primary">Save</button>
            <a href="{% url 'transactions:dashboard' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
    <div class="right-dashboard">
        <div>
            {% include 'transactions/budget_table.html' %}
        </div>
        <div>
            <br>
        </div>
        <div>
            <h3>Remaining Budget</h3>
            {% include 'transactions/remaining_budget.html' %}
        </div>
    </div>
</div>
{% endblock %}
