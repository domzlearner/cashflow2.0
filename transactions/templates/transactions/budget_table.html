
<h3>Budget List</h3>
<table>
    <thead>
        <tr>
            <th>Period</th>
            <th>Category</th>
            <th>Amount</th>
        </tr>
    </thead>
    <tbody>
        {% for budget in budgets %}
            <tr>
                <td>{{ budget.period }}</td>
                <td>{{ budget.get_category_display|default_if_none:"-" }}</td>
                <td class="amount">
                    {{ budget.amount|floatformat:2 }}
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="5">No budgets found.</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
